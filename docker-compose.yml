# Full stack per MASTER_SPEC section 3/22: frontend, API, worker, browser-worker,
# scheduler, Postgres, Redis, MinIO. Playwright/Chromium only ever runs inside
# browser-worker; the API process never runs browser or LLM jobs inline.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webops}
      POSTGRES_DB: ${POSTGRES_DB:-webops}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-webops123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-site:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    command: python mock_site/app.py
    ports:
      - "5050:5050"
    environment:
      FLASK_RUN_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webops}:${POSTGRES_PASSWORD:-webops}@postgres:5432/${POSTGRES_DB:-webops}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MOCK_SITE_BASE_URL: http://mock-site:5050
    volumes:
      - agent-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-site:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    command: python -m backend.app.jobs.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webops}:${POSTGRES_PASSWORD:-webops}@postgres:5432/${POSTGRES_DB:-webops}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MOCK_SITE_BASE_URL: http://mock-site:5050
    volumes:
      - agent-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-site:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.browser
    command: python -m browser.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webops}:${POSTGRES_PASSWORD:-webops}@postgres:5432/${POSTGRES_DB:-webops}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MOCK_SITE_BASE_URL: http://mock-site:5050
    volumes:
      - agent-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-site:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    command: python -m scheduler_service.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-webops}:${POSTGRES_PASSWORD:-webops}@postgres:5432/${POSTGRES_DB:-webops}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - agent-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
  agent-logs:
